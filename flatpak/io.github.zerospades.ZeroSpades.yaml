app-id: io.github.zerospades.ZeroSpades
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: zerospades
rename-desktop-file: zerospades.desktop
rename-icon: zerospades
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --persist=.local/share/openspades
cleanup:
  - /include
  - /lib/pkgconfig
modules:
  - shared-modules/glew/glew.json
  - shared-modules/SDL2/SDL2_image.json
  - name: imagemagick
    cleanup:
      - "*"
    sources:
      - type: git
        url: https://github.com/ImageMagick/ImageMagick.git
        tag: 7.1.1-38
        commit: b0ab92265bab638e6ecd2f18b45977c38771c671

  - name: zerospades
    buildsystem: cmake-ninja
    config-opts:
      - -DZEROSPADES_INSTALL_BINARY=bin
      - -DZEROSPADES_RESDIR=/app/extra/Resources/
      - -DCMAKE_CXX_FLAGS=-DGLEW_NO_GLU
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_EXE_LINKER_FLAGS=-lcurl
      - -DZEROSPADES_NONFREE_RESOURCES=OFF
    post-install:
      - install -Dm0644 flatpak/io.github.zerospades.ZeroSpades.metainfo.xml -t /app/share/metainfo/
      - install -Dm755 apply_extra /app/bin/apply_extra
    sources:
      - type: dir
        path: ..
      - type: script
        dest-filename: apply_extra
        commands:
          - unzip -q nonfree-paks.zip
          - rm nonfree-paks.zip
          - mkdir --parents Resources
          - mv Nonfree/* ./Resources
          - mv OfficialMods/* ./Resources
          - rmdir Nonfree OfficialMods
      - type: extra-data
        filename: nonfree-paks.zip
        url: https://github.com/yvt/openspades-paks/releases/download/r33/OpenSpadesDevPackage-r33.zip
        sha256: 0927dc323a0b3aba0ee8d1d68d6b544b00fe654740fead6d1faad37aac77a2ad
        size: 4036321
